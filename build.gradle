plugins {
    id 'fabric-loom' version '1.10.5'
    id 'maven-publish'
}

// Semantic Versioning (https://semver.org): mod_version is MAJOR.MINOR.PATCH[-prerelease];
// the Minecraft version is SemVer build metadata and does not affect precedence.
version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

// '+' is rewritten in GitHub release asset names, so jar files use only mod_version.
tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = mod_version
}

repositories {
    maven {
        name = 'Fzzyhmstrs'
        url = 'https://maven.fzzyhmstrs.me/'
    }
    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Curse Maven'
        url = 'https://www.cursemaven.com'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "dev.emi:trinkets:${trinkets_version}"
    // Fzzy Config's license forbids jar-in-jar, so it (and Fabric Language Kotlin) must be installed separately.
    modImplementation "me.fzzyhmstrs:fzzy_config:${fzzy_config_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${modmenu_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cardinal_components_version}"
    modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${cardinal_components_version}"
    include "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cardinal_components_version}"
    include "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${cardinal_components_version}"
    modCompileOnly("curse.maven:serene-seasons-291874:6398228") { transitive = false }
    modCompileOnly("curse.maven:glitchcore-955399:5787838") { transitive = false }
    // GlitchCore's config classes (used by the Serene Seasons integration) extend night-config types; GlitchCore bundles it at runtime.
    compileOnly "com.electronwill.night-config:core:3.6.7"
}

sourceSets.main.resources.srcDir 'src/generated/resources'

sourceSets.main.java {
    exclude 'sfiomn/legendarysurvivaloverhaul/data/DataGenerators.java'
    exclude 'sfiomn/legendarysurvivaloverhaul/data/integration/**'
    exclude 'sfiomn/legendarysurvivaloverhaul/data/loot/**'
    exclude 'sfiomn/legendarysurvivaloverhaul/data/providers/**'
    exclude 'sfiomn/legendarysurvivaloverhaul/data/recipes/**'
    exclude '**/api/data/providers/**'
    exclude '**/common/events/CommonForgeEvents.java'
    exclude '**/common/events/CommonModBusEvents.java'
    exclude '**/client/events/ClientForgeEvents.java'
    exclude '**/client/render/RenderTooltipFrame.java'
    exclude '**/client/shaders/FocusShader.java'
    exclude '**/common/integration/eclipticseasons/**'
    exclude '**/common/integration/jei/**'
    exclude '**/common/integration/crayfish/CrayfishFurnitureUtil.java'
    exclude '**/common/integration/mutantmonsters/**'
    exclude '**/common/integration/supplementaries/SupplementariesUtil.java'
    exclude '**/common/integration/vampirism/**'
    exclude '**/common/integration/terrafirmacraft/TerraFirmaCraftHeatItemModifier.java'
    exclude '**/common/integration/terrafirmacraft/TerraFirmaCraftModifier.java'
    exclude '**/common/listeners/EnchantmentListener.java'
    exclude '**/common/level/gen/ModBiomeModifiers.java'
    exclude '**/registry/LootModifierRegistry.java'
    exclude '**/common/loot_modifiers/**'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'minecraft_version': minecraft_version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
}
